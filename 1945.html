<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Air Strike 1945</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0a1226; --panel:#13204a; --edge:#2c3f82; --ink:#f3ecd2; --dim:#93a0d0;
  --sand:#ffd23d; --red:#ff4a5a; --sea:#4a82f0;
  --px:'Press Start 2P','Courier New',monospace;
  --ko:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--ko);min-height:100%;overscroll-behavior:none}
body{display:flex;justify-content:center;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom))}
#app{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
#stage{position:relative;width:min(100%,calc((100dvh - 74px) * 2 / 3));border:2px solid var(--edge);background:#000;line-height:0;user-select:none;-webkit-user-select:none}
#c{width:100%;height:auto;aspect-ratio:2/3;image-rendering:pixelated;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,28,.8);line-height:1.4;padding:14px;overflow:auto}
#ov.hide{display:none}
.card{width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.card h1{font-family:var(--px);font-size:clamp(18px,5.4vw,30px);line-height:1.4;margin:0;color:var(--sand);text-shadow:3px 3px 0 #b3361f,6px 6px 0 #0a1226;letter-spacing:1px}
.card h2{font-size:clamp(22px,5vw,30px);margin:0;color:var(--ink)}
.card p{margin:0;color:var(--dim);font-size:14px}
.big{font-family:var(--px);font-size:15px;color:var(--sand)}
.btns{display:grid;gap:8px;width:100%}
.legend{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:13px;color:var(--dim);margin:0}
.legend dt{justify-self:end;white-space:nowrap}.legend dd{margin:0}
kbd{font-family:var(--px);font-size:9px;background:var(--panel);border:1px solid var(--edge);border-bottom-width:3px;padding:3px 5px;color:var(--ink)}
button{font:700 14px var(--ko);color:var(--ink);background:var(--panel);border:2px solid var(--edge);border-bottom-width:4px;padding:11px 14px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--dim)}
button:active{transform:translateY(2px);border-bottom-width:2px}
button:focus-visible{outline:3px solid var(--sand);outline-offset:2px}
button.primary{background:var(--sand);color:#2a1300;border-color:#b8860b}
#bombbtn{display:none;position:absolute;right:10px;bottom:10px;width:64px;height:64px;border-radius:50%;padding:0;font-family:var(--px);font-size:12px;background:rgba(74,130,240,.55);border-color:#9ab8ff;line-height:1.2;z-index:2}
@media (pointer:coarse){#bombbtn{display:block}}
#foot{width:min(100%,calc((100dvh - 74px) * 2 / 3));display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--dim)}
#foot span{line-height:1.5}
#foot .b button{padding:5px 10px;font-size:12px}
#foot a{color:var(--dim);font-size:12px;margin-right:8px;text-decoration:none;border-bottom:1px solid var(--edge)}
#bombbtn{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
@media (pointer:coarse){#foot .keys{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" width="480" height="720"></canvas>
    <button id="bombbtn" aria-label="폭탄">BOMB</button>
    <div id="ov"></div>
  </div>
  <div id="foot">
    <span class="keys">방향키 이동 &nbsp; Shift 느리게 &nbsp; Space 폭탄 &nbsp; P 일시정지</span>
    <span class="b"><a href="./">← 게임 목록</a><button id="pbtn">일시정지</button> <button id="mute">소리 끔</button></span>
  </div>
</div>

<script>
(() => {
'use strict';
const W = 480, H = 720, PI = Math.PI;
const $ = s => document.querySelector(s);
const cv = $('#c'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const ov = $('#ov');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const cnv = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ===================== 스프라이트 ===================== */
const PAL = { w:'#f4f4f4', g:'#a7b0c2', G:'#6d768c', b:'#4a82f0', B:'#223f9e', c:'#9aeaff', y:'#ffd23d',
              o:'#ff8a2a', r:'#e8453c', R:'#8f1f2a', n:'#58b05a', N:'#2e7d3c', k:'#2b3040', s:'#cdb97e', p:'#ff4d86' };
function buildSprite(rows, o = {}) {
  const scale = o.scale || 3, P = Object.assign({}, PAL, o.pal || {});
  const wd = Math.max(...rows.map(r => r.length));
  const grid = rows.map(r => {
    r = r.padStart(wd, '.');
    const full = r + r.slice(0, -1).split('').reverse().join('');
    return full.split('').map(ch => ch === '.' ? null : (P[ch] || '#f0f'));
  });
  if (o.flipV) grid.reverse();
  const gw = grid[0].length, gh = grid.length, OW = gw + 2, OH = gh + 2;
  const out = Array.from({ length: OH }, () => Array(OW).fill(null));
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) out[y + 1][x + 1] = grid[y][x];
  const res = out.map(r => r.slice());
  for (let y = 0; y < OH; y++) for (let x = 0; x < OW; x++) {
    if (out[y][x]) continue;
    if ((out[y - 1] && out[y - 1][x]) || (out[y + 1] && out[y + 1][x]) || out[y][x - 1] || out[y][x + 1]) res[y][x] = '#0e1019';
  }
  const c = cnv(OW * scale, OH * scale), g = c.getContext('2d');
  for (let y = 0; y < OH; y++) for (let x = 0; x < OW; x++) if (res[y][x]) { g.fillStyle = res[y][x]; g.fillRect(x * scale, y * scale, scale, scale); }
  const tint = col => { const t = cnv(c.width, c.height), tg = t.getContext('2d'); tg.drawImage(c, 0, 0); tg.globalCompositeOperation = 'source-atop'; tg.fillStyle = col; tg.fillRect(0, 0, t.width, t.height); return t; };
  return { c, f: tint('#ffffff'), s: tint('#000000'), w: c.width, h: c.height };
}
const SPR = {};
SPR.player = buildSprite([
  '.......w', '.......w', '......gw', '......gc', '......gc', '.....bgb', '....bbbb', '...bbbbb',
  'gbbbbbbb', 'bbbbbbbb', 'Bbbbbbbb', 'B..bbBbb', '......Bb', '.......y']);
const ZAKO = ['.....y', '.....r', '...rrc', '.rrrrc', 'rrrrrR', 'r..rrr', '.....r', '.....g'];
SPR.zako = buildSprite(ZAKO, { flipV: true });
SPR.zako2 = buildSprite(ZAKO, { flipV: true, pal: { r: '#f0a030', R: '#9a5f1a' } });
SPR.carrier = buildSprite(ZAKO, { flipV: true, pal: { r: '#4a82f0', R: '#223f9e', c: '#fff' }, scale: 4 });
SPR.mid = buildSprite([
  '........g', '........n', '.......nn', '..nnnnnnc', '.nnnnNnnc', 'nnnnnnnnn', 'NnnnnnnNn', 'N.nnnnnNn',
  '...NnnnNn', '.....nnnn', '......nNn', '.......yy'], { flipV: true });
SPR.ship = buildSprite([
  '.....G', '....gg', '...ggg', '..gggg', '..gggw', '.gggkk', '.gsssg', '.gsssg', '.gggkk', '.ggggg',
  '.gsssg', '.gsssg', '.gggkk', '.ggggg', '..gggg', '..gggg', '...ggg', '...gGG']);
const BOSS = [
  '...............y', '..............gg', '..............gg', '.............ggc', '............gggc', '...........ggggg',
  '......ggggggggRg', '.....gggggggggRR', '..ggggggggggggRR', '.gggGGGgggggggRR', 'gggGGGGGggggggoo', 'ggggGGGGgggggooo',
  'GGggggggggggggoo', 'GG..ggggggggGGgg', 'G...ggggggggGGgg', '....GGggggggggRR', '.....GGggggggggg', '......ggggggRRgg',
  '.......gggggRRgg', '........gggggggg', '.........ggggggg', '..........ggyyyy'];
SPR.boss = [
  buildSprite(BOSS, { flipV: true, scale: 4 }),
  buildSprite(BOSS, { flipV: true, scale: 4, pal: { g: '#8fa55a', G: '#566b34' } }),
  buildSprite(BOSS, { flipV: true, scale: 4, pal: { g: '#a58fd0', G: '#5d4a8a', R: '#e8a53c' } })
];
SPR.bulS = buildSprite(['..p', '.pw', 'ppw', '.pw', '..p'], { scale: 2 });
SPR.bulB = buildSprite(['...o', '.ooy', 'ooyy', 'ooyy', 'ooyy', '.ooy', '...o'], { scale: 2, pal: { o: '#ff9a2a', y: '#fff2a0' } });
SPR.bulC = buildSprite(['..p', '.pw', 'ppw', '.pw', '..p'], { scale: 2, pal: { p: '#4dd0ff' } });
const BULS = [SPR.bulS, SPR.bulB, SPR.bulC];

/* ===================== 배경 ===================== */
const BGW = 240, BGH = 720;               // 저해상도 → 2배 확대
const bgc = cnv(BGW, BGH), clc = cnv(BGW, BGH);
function disc(g, cx, cy, r, col) {
  g.fillStyle = col;
  for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); }
}
function makeBg() {
  const g = bgc.getContext('2d');
  g.fillStyle = '#1b5b9c'; g.fillRect(0, 0, BGW, BGH);
  for (let i = 0; i < 520; i++) {
    g.fillStyle = Math.random() < .5 ? '#2a73b4' : '#3b86c6';
    g.fillRect(rint(0, BGW - 8), rint(0, BGH - 1), rint(3, 8), 1);
  }
  for (let k = 0; k < 6; k++) {
    const cx = rint(30, BGW - 30), cy = rint(40, BGH - 40), r = rint(14, 30);
    const offs = [0]; if (cy - r - 8 < 0) offs.push(BGH); if (cy + r + 8 > BGH) offs.push(-BGH);
    const blobs = [[0, 0, r], [rint(-r, r) * .6, rint(-r, r) * .6, r * .7 | 0], [rint(-r, r) * .6, rint(-r, r) * .6, r * .6 | 0]];
    offs.forEach(oy => {
      blobs.forEach(([bx, by, br]) => disc(g, cx + bx | 0, cy + by + oy | 0, br + 6, '#2f93c4'));
      blobs.forEach(([bx, by, br]) => disc(g, cx + bx | 0, cy + by + oy | 0, br + 2, '#e6d59a'));
      blobs.forEach(([bx, by, br]) => disc(g, cx + bx | 0, cy + by + oy | 0, br, '#4a9a48'));
      blobs.forEach(([bx, by, br]) => disc(g, cx + bx + 2 | 0, cy + by + 2 + oy | 0, Math.max(2, br - 5), '#3a7f3c'));
      for (let i = 0; i < r / 2; i++) { g.fillStyle = '#245c2e'; g.fillRect(cx + rint(-r, r) * .6 | 0, cy + rint(-r, r) * .6 + oy | 0, 2, 2); }
    });
  }
  const c = clc.getContext('2d');
  for (let k = 0; k < 7; k++) {
    const cx = rint(10, BGW - 10), cy = rint(10, BGH - 10);
    [0, BGH, -BGH].forEach(oy => {
      for (let i = 0; i < 4; i++) disc(c, cx + rint(-14, 14), cy + rint(-5, 5) + oy, rint(6, 12), 'rgba(255,255,255,.55)');
    });
  }
}

/* ===================== 상태 ===================== */
const SCROLL = 1.1, BOSS_AT = 2500;
const ET = {
  zako:    { spr: SPR.zako,    hp: 1,  hw: 14, hh: 11, score: 100, br: 14 },
  zako2:   { spr: SPR.zako2,   hp: 2,  hw: 14, hh: 11, score: 200, br: 16 },
  carrier: { spr: SPR.carrier, hp: 4,  hw: 20, hh: 16, score: 300, br: 20 },
  mid:     { spr: SPR.mid,     hp: 14, hw: 22, hh: 16, score: 600, br: 30 },
  ship:    { spr: SPR.ship,    hp: 22, hw: 14, hh: 24, score: 800, br: 30, ground: true },
  boss:    { spr: null,        hp: 0,  hw: 56, hh: 32, score: 10000, br: 60 }
};
let st = 'menu', frame = 0, stage = 1, stageT = 0, nextWave = 0, boss = null, clearT = 0, bombT = 0;
let flashA = 0, shake = 0, banner = null, score = 0, hi = 0, nextExtra = 50000, goT = 0, lastCarrier = 0;
let enemies = [], pb = [], eb = [], items = [], parts = [], booms = [], floats = [], later = [];
let bgY = 0, clY = 0, tdx = 0, tdy = 0, muted = false;
const player = { x: W / 2, y: H - 90, lvl: 1, bombs: 3, lives: 3, inv: 0, alive: true, respT: 0, shotT: 0 };
const keys = new Set();
try { hi = +localStorage.getItem('airstrike1945-hi') || 0; } catch (e) {}

/* ===================== 소리 ===================== */
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function noise(a, dur, freq, vol) {
  const t = a.currentTime, len = (a.sampleRate * dur) | 0;
  const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = a.createGain(); g.gain.value = vol;
  s.connect(f).connect(g).connect(a.destination); s.start(t);
}
function tone(a, f0, f1, dur, vol, type = 'square') {
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .01);
}
let lastSnd = {};
function snd(k, big = 1) {
  if (muted) return;
  const a = audio(); if (!a) return;
  const now = performance.now();
  if (lastSnd[k] && now - lastSnd[k] < 45) return;
  lastSnd[k] = now;
  if (k === 'boom') noise(a, .25 + .3 * big, 400 + 500 / big, .22 + .1 * big);
  else if (k === 'hit') tone(a, 300, 200, .04, .03);
  else if (k === 'item') { tone(a, 600, 1200, .12, .07); }
  else if (k === 'bomb') { noise(a, 1.1, 900, .5); tone(a, 220, 40, .9, .12, 'sawtooth'); }
  else if (k === 'warn') { tone(a, 440, 330, .35, .08); setTimeout(() => tone(a, 440, 330, .35, .08), 450); }
  else if (k === 'die') { noise(a, .9, 700, .5); tone(a, 300, 50, .7, .1, 'sawtooth'); }
}

/* ===================== 유틸 / 효과 ===================== */
function addScore(n) {
  score += n;
  if (score >= nextExtra) { player.lives++; nextExtra += 100000; floats.push({ x: W / 2, y: 300, text: 'EXTEND', t: 0, c: '#9aeaff' }); snd('item'); }
}
function boom(x, y, size) {
  booms.push({ x, y, r: size, t: 0 });
  const n = Math.min(40, 6 + size / 2 | 0);
  for (let i = 0; i < n; i++) {
    const a = rnd(0, PI * 2), sp = rnd(.6, 1.2 + size / 25);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rint(18, 40), c: ['#ffd23d', '#ff8a2a', '#e8453c', '#555b6e'][rint(0, 3)] });
  }
}
function aim(x, y) { return Math.atan2(player.y - y, player.x - x); }
function bulSpeed() { return Math.min(3.6, 2.0 + .22 * (stage - 1)); }
function ebul(x, y, ang, sp, k = 0) { eb.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, k, r: k === 1 ? 5 : 3 }); }
function after(f, fn) { later.push({ f, fn }); }

/* ===================== 적 생성 ===================== */
function spawn(type, x, y, o = {}) {
  const d = ET[type];
  const hp = Math.ceil(d.hp * (1 + .25 * (stage - 1)));
  const e = Object.assign({ type, x, y, vx: 0, vy: 2, hp, mhp: hp, t: 0, flash: 0, pat: 'line', dir: 1, x0: x, A: 50, ph: 0,
                            shoot: false, fireT: rint(40, 110), drop: null, dead: false }, o);
  enemies.push(e); return e;
}
function patSine() { const x = rnd(110, W - 110), ph = rnd(0, 6); for (let i = 0; i < 5; i++) after(i * 16, () => spawn('zako', x, -24, { pat: 'sine', vy: 2, x0: x, A: 70, ph, shoot: i === 2 })); }
function patV() { const x = rnd(120, W - 120); [[0, 0], [-34, 28], [34, 28], [-68, 56], [68, 56]].forEach((o, i) => spawn('zako', x + o[0], -24 - o[1], { vy: 2.6, shoot: i === 0 })); }
function patSwoop() {
  const dir = Math.random() < .5 ? 1 : -1, y0 = rnd(70, 150);
  for (let i = 0; i < 5; i++) after(i * 14, () => spawn('zako', dir > 0 ? -20 : W + 20, y0, { pat: 'swoop', dir, vx: dir * 3.4, vy: .8, shoot: i === 2 }));
}
function patCols() { for (let i = 0; i < 4; i++) after(i * 10, () => spawn('zako2', 70 + i * 113, -24, { vy: 1.8, shoot: true })); }
function patMid() { spawn('mid', rnd(110, W - 110), -30, { pat: 'mid' }); }
function patShip() { spawn('ship', rnd(60, W - 60), -60, { pat: 'ship', vy: SCROLL }); }
function patCarrier() {
  const x = rnd(120, W - 120);
  spawn('carrier', x, -24, { pat: 'sine', A: 40, vy: 1.6, drop: 'P' });
  after(20, () => spawn('zako', x - 40, -24, { pat: 'sine', A: 40, vy: 1.6, x0: x - 40 }));
  after(20, () => spawn('zako', x + 40, -24, { pat: 'sine', A: 40, vy: 1.6, x0: x + 40 }));
}
function randomPattern() {
  const o = [[patSine, 3], [patV, 3], [patSwoop, 2]];
  if (stageT > 500) o.push([patMid, 2]);
  if (stageT > 350) o.push([patShip, 1.5]);
  if (stage >= 2) o.push([patCols, 2]);
  let sum = o.reduce((a, b) => a + b[1], 0), r = Math.random() * sum;
  for (const [f, w] of o) { r -= w; if (r <= 0) return f(); }
}
function spawnBoss() {
  const hp = 500 + 260 * (stage - 1);
  boss = spawn('boss', W / 2, -80, { hp, mhp: hp, state: 'enter', ph: 1, vy: 0 });
  boss.fireT = 0;
}

/* ===================== 진행 ===================== */
function director() {
  if (clearT > 0) {
    clearT--;
    if (clearT === 0) { stage++; stageT = 0; nextWave = 100; lastCarrier = 0; banner = { t: 150, text: 'STAGE ' + stage, col: '#ffd23d' }; }
    return;
  }
  if (boss) { if (boss.state === 'fight' && frame % 300 === 0 && stage > 1) patSine(); return; }
  if (stageT === BOSS_AT - 170) { banner = { t: 170, text: 'WARNING', col: '#ff4a5a', blink: true }; snd('warn'); }
  if (stageT >= BOSS_AT) { spawnBoss(); return; }
  if (stageT >= BOSS_AT - 170 || stageT < 90) return;
  if (stageT - lastCarrier > 700 || (lastCarrier === 0 && stageT > 240)) { patCarrier(); lastCarrier = stageT; }
  if (stageT >= nextWave) { randomPattern(); nextWave = stageT + Math.max(50, 118 - stage * 9) + rint(0, 28); }
}
function dropItem(type, x, y) { items.push({ type, x, y, vx: Math.random() < .5 ? -.6 : .6, vy: 1.1, t: 0 }); }
function killEnemy(e) {
  if (e.dead || e.dying) return;
  if (e.type === 'boss') { e.dying = true; e.dyT = 120; eb.length = 0; snd('boom', 2); return; }
  e.dead = true;
  const d = ET[e.type];
  addScore(d.score);
  boom(e.x, e.y, d.br);
  snd('boom', d.br / 25);
  if (e.drop) dropItem(e.drop, e.x, e.y);
  else if (e.type === 'mid') dropItem(Math.random() < .35 ? (player.lvl < 4 ? 'P' : 'B') : 'm', e.x, e.y);
  else if (e.type === 'ship') dropItem(Math.random() < .4 ? 'B' : 'm', e.x, e.y);
  else if (Math.random() < .08) dropItem('m', e.x, e.y);
}
function hitEnemy(e, n) {
  if (e.dead || e.dying) return;
  e.hp -= n; e.flash = 2;
  if (e.hp <= 0) killEnemy(e); else if (e.type === 'boss') snd('hit');
}
function killPlayer() {
  const p = player;
  if (!p.alive || p.inv > 0) return;
  boom(p.x, p.y, 28); snd('die');
  p.alive = false; p.lives--; p.lvl = Math.max(1, p.lvl - 1); p.bombs = Math.max(p.bombs, 2);
  eb.length = 0; p.respT = 80; shake = 8;
  if (p.lives <= 0) goT = 100;
}
function useBomb() {
  const p = player;
  if (st !== 'play' || !p.alive || p.bombs <= 0 || bombT > 0) return;
  p.bombs--; bombT = 100; p.inv = Math.max(p.inv, 120); flashA = .9; shake = 10; snd('bomb');
}

/* ===================== 업데이트 ===================== */
function pbul(x, y, a) { pb.push({ x, y, vx: Math.sin(a) * 12, vy: -Math.cos(a) * 12, a }); }
function playerFire() {
  const p = player, x = p.x, y = p.y - 22;
  if (p.lvl === 1) { pbul(x - 6, y, 0); pbul(x + 6, y, 0); }
  else if (p.lvl === 2) { pbul(x - 12, y + 4, 0); pbul(x, y, 0); pbul(x + 12, y + 4, 0); }
  else if (p.lvl === 3) { pbul(x - 6, y, 0); pbul(x + 6, y, 0); pbul(x - 14, y + 6, -.14); pbul(x + 14, y + 6, .14); }
  else { pbul(x - 5, y, 0); pbul(x + 5, y, 0); pbul(x - 14, y + 6, -.13); pbul(x + 14, y + 6, .13); pbul(x - 20, y + 10, -.3); pbul(x + 20, y + 10, .3); }
}
function updPlayer() {
  const p = player;
  if (!p.alive) {
    if (--p.respT <= 0 && p.lives > 0) { p.alive = true; p.x = W / 2; p.y = H - 90; p.inv = 170; }
    return;
  }
  let dx = 0, dy = 0;
  if (keys.has('arrowleft') || keys.has('a')) dx--;
  if (keys.has('arrowright') || keys.has('d')) dx++;
  if (keys.has('arrowup') || keys.has('w')) dy--;
  if (keys.has('arrowdown') || keys.has('s')) dy++;
  if (dx && dy) { dx *= .7071; dy *= .7071; }
  const sp = keys.has('shift') ? 1.9 : 4.4;
  p.x = clamp(p.x + dx * sp + tdx, 20, W - 20);
  p.y = clamp(p.y + dy * sp + tdy, 40, H - 34);
  tdx = tdy = 0;
  if (p.inv > 0) p.inv--;
  if (--p.shotT <= 0) { playerFire(); p.shotT = 5; }
}
function updBoss(e) {
  if (e.state === 'enter') { e.y += 1.3; if (e.y >= 130) { e.state = 'fight'; e.t = 0; } return; }
  const r = e.hp / e.mhp, ph = r > .66 ? 1 : r > .33 ? 2 : 3;
  if (ph !== e.ph) { e.ph = ph; eb.length = 0; }
  const sp = ph === 3 ? .016 : ph === 2 ? .013 : .01;
  e.x = W / 2 + Math.sin(e.t * sp) * 150; e.y = 130 + Math.sin(e.t * .02) * 14;
  const t = e.t, bs = bulSpeed(), n = Math.min(8, stage - 1), fy = e.y + 30;
  if (ph === 1) {
    if (t % 90 === 0) { const a = aim(e.x, fy); for (let i = -2; i <= 2; i++) ebul(e.x, fy, a + i * .2, bs, 0); }
    if (t % 40 === 20) { [-44, 44].forEach(o => ebul(e.x + o, e.y + 10, aim(e.x + o, e.y + 10), bs * 1.1, 1)); }
  } else if (ph === 2) {
    if (t % 75 === 0) { const c = 14 + n, off = t * .05; for (let i = 0; i < c; i++) ebul(e.x, e.y + 20, off + i * 2 * PI / c, bs * .9, 2); }
    if (t % 110 === 55) { const a = aim(e.x, fy); for (let i = -1; i <= 1; i++) ebul(e.x, fy, a + i * .25, bs * 1.15, 1); }
  } else {
    if (t % 5 === 0) ebul(e.x, e.y + 20, t * .19, bs, 0);
    if (t % 130 === 0) { const c = 20 + n; for (let i = 0; i < c; i++) ebul(e.x, e.y + 20, i * 2 * PI / c, bs * .85, 2); }
    if (t % 70 === 35) { const a = aim(e.x, fy); for (let i = -1; i <= 1; i++) ebul(e.x, fy, a + i * .22, bs * 1.1, 1); }
  }
}
function updBossDying(e) {
  e.dyT--; shake = Math.max(shake, 3);
  if (e.dyT % 6 === 0) { boom(e.x + rnd(-50, 50), e.y + rnd(-26, 26), rint(18, 34)); snd('boom', 1); }
  if (e.dyT <= 0) {
    e.dead = true; boss = null;
    boom(e.x, e.y, 90); shake = 14; flashA = .8; snd('boom', 3);
    addScore(ET.boss.score);
    dropItem('P', e.x - 30, e.y); dropItem('B', e.x + 30, e.y);
    for (let i = 0; i < 6; i++) dropItem('m', e.x + rnd(-60, 60), e.y + rnd(-20, 20));
    clearT = 220; banner = { t: 200, text: 'STAGE CLEAR', col: '#9aeaff' };
    for (const b of eb) { b.dead = true; }
  }
}
function updEnemy(e) {
  if (e.dying) return updBossDying(e);
  e.t++; if (e.flash > 0) e.flash--;
  if (e.type === 'boss') return updBoss(e);
  switch (e.pat) {
    case 'line':  e.y += e.vy; break;
    case 'sine':  e.y += e.vy; e.x = e.x0 + Math.sin(e.t * .045 + e.ph) * e.A; break;
    case 'swoop': e.vx -= e.dir * .045; e.x += e.vx; e.y += e.vy; e.vy += .012; break;
    case 'mid':   if (e.t < 70) e.y += 1.8; else if (e.t < 330) { e.y += .12; e.x += Math.sin(e.t * .02) * .8; } else e.y += 1.8; break;
    case 'ship':  e.y += SCROLL; break;
  }
  const bs = bulSpeed();
  if (e.y > 30 && e.y < 470) {
    if (e.type === 'mid') {
      if (e.t % 75 === 40) { const a = aim(e.x, e.y + 14), c = stage > 2 ? 2 : 1; for (let i = -c; i <= c; i++) ebul(e.x, e.y + 14, a + i * .28, bs, 0); }
    } else if (e.type === 'ship') {
      if (e.t % 120 === 60) for (let i = 0; i < 3; i++) after(i * 9, () => { if (!e.dead) ebul(e.x, e.y, aim(e.x, e.y), bs * .95, 0); });
    } else if (e.shoot || e.type !== 'zako') {
      if (--e.fireT <= 0) { ebul(e.x, e.y + 8, aim(e.x, e.y), bs * .9, 0); e.fireT = rint(100, 180) / (1 + .1 * (stage - 1)); }
    }
  }
  if (e.y > H + 70 || e.y < -140 || e.x < -90 || e.x > W + 90) e.dead = true;
}
function updPlay() {
  frame++;
  if (!boss && !clearT) stageT++;
  for (const l of later) l.f--;
  const due = later.filter(l => l.f <= 0);
  if (due.length) { later = later.filter(l => l.f > 0); due.forEach(l => l.fn()); }
  director();
  updPlayer();

  if (bombT > 0) {
    bombT--; eb.length = 0;
    if (bombT % 5 === 0) enemies.forEach(e => { if (e.y > -10 && !(e.type === 'boss' && e.state !== 'fight')) hitEnemy(e, e.type === 'boss' ? 3 : 5); });
  }
  pb.forEach(b => { b.x += b.vx; b.y += b.vy; if (b.y < -20 || b.x < -20 || b.x > W + 20) b.dead = true; });
  enemies.forEach(updEnemy);
  eb.forEach(b => { b.x += b.vx; b.y += b.vy; if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > H + 30) b.dead = true; });

  for (const b of pb) {
    if (b.dead) continue;
    for (const e of enemies) {
      if (e.dead || e.dying || e.y < -4) continue;
      if (e.type === 'boss' && e.state !== 'fight') continue;
      const d = ET[e.type];
      if (Math.abs(b.x - e.x) < d.hw + 2 && Math.abs(b.y - e.y) < d.hh + 6) { b.dead = true; hitEnemy(e, 1); break; }
    }
  }
  const p = player;
  if (p.alive && p.inv <= 0) {
    for (const b of eb) { const dx = b.x - p.x, dy = b.y - p.y, rr = b.r + 3; if (dx * dx + dy * dy < rr * rr) { killPlayer(); break; } }
    if (p.alive) for (const e of enemies) {
      if (e.dead || e.dying || e.y < 0) continue;
      const d = ET[e.type];
      if (Math.abs(e.x - p.x) < d.hw * .7 + 3 && Math.abs(e.y - p.y) < d.hh * .7 + 3) { killPlayer(); break; }
    }
  }
  items.forEach(it => {
    it.t++; it.x += it.vx; it.y += it.vy;
    if (it.x < 14 || it.x > W - 14) it.vx = -it.vx;
    if (it.y > H + 20) it.dead = true;
    if (p.alive && Math.hypot(it.x - p.x, it.y - p.y) < 24) {
      it.dead = true; snd('item');
      if (it.type === 'P') { if (p.lvl < 4) p.lvl++; else addScore(5000); }
      else if (it.type === 'B') { if (p.bombs < 6) p.bombs++; else addScore(3000); }
      else { addScore(500); floats.push({ x: it.x, y: it.y - 8, text: '500', t: 0, c: '#ffd23d' }); }
    }
  });

  pb = pb.filter(b => !b.dead); eb = eb.filter(b => !b.dead);
  enemies = enemies.filter(e => !e.dead); items = items.filter(i => !i.dead);
  booms.forEach(b => b.t++); booms = booms.filter(b => b.t < 28);
  parts.forEach(q => { q.x += q.vx; q.y += q.vy; q.life--; });
  parts = parts.filter(q => q.life > 0);
  floats.forEach(f => { f.t++; f.y -= .4; }); floats = floats.filter(f => f.t < 50);
  if (banner && --banner.t <= 0) banner = null;
  if (flashA > 0) flashA = Math.max(0, flashA - .035);
  if (goT > 0 && --goT === 0) gameOver();
}
function update() {
  if (st !== 'paused') { bgY = (bgY + SCROLL) % (BGH * 2); clY = (clY + 2.3) % (BGH * 2); }
  if (st === 'play') updPlay();
}

/* ===================== 렌더 ===================== */
function drawSpr(s, x, y, kind = 'c') { ctx.drawImage(s[kind], Math.round(x - s.w / 2), Math.round(y - s.h / 2)); }
function txt(s, x, y, col, align = 'left', size = 10) {
  ctx.font = size + 'px "Press Start 2P", monospace'; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#000'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function drawItem(it) {
  const x = Math.round(it.x), y = Math.round(it.y), bl = (it.t >> 3) & 1;
  if (it.type === 'm') {
    ctx.fillStyle = '#7a5a00'; ctx.fillRect(x - 5, y - 2, 11, 5); ctx.fillRect(x - 2, y - 5, 5, 11);
    ctx.fillStyle = '#ffd23d'; ctx.fillRect(x - 4, y - 1, 9, 3); ctx.fillRect(x - 1, y - 4, 3, 9);
    return;
  }
  const col = it.type === 'P' ? (bl ? '#ff4a5a' : '#ff9a2a') : (bl ? '#4a82f0' : '#9ab8ff');
  ctx.fillStyle = '#0e1019'; ctx.fillRect(x - 11, y - 9, 22, 18); ctx.fillRect(x - 9, y - 11, 18, 22);
  ctx.fillStyle = col; ctx.fillRect(x - 10, y - 8, 20, 16); ctx.fillRect(x - 8, y - 10, 16, 20);
  txt(it.type, x, y - 5, '#fff', 'center', 10);
}
function render() {
  ctx.save();
  if (shake > 0) { ctx.translate(Math.round(rnd(-shake, shake) / 2), Math.round(rnd(-shake, shake) / 2)); shake *= .88; if (shake < .4) shake = 0; }
  ctx.drawImage(bgc, 0, 0, BGW, BGH, 0, bgY - BGH * 2, W, BGH * 2);
  ctx.drawImage(bgc, 0, 0, BGW, BGH, 0, bgY, W, BGH * 2);
  ctx.globalAlpha = .5;
  ctx.drawImage(clc, 0, 0, BGW, BGH, 0, clY - BGH * 2, W, BGH * 2);
  ctx.drawImage(clc, 0, 0, BGW, BGH, 0, clY, W, BGH * 2);
  ctx.globalAlpha = 1;

  const bossSpr = SPR.boss[(stage - 1) % 3];
  const sprOf = e => e.type === 'boss' ? bossSpr : ET[e.type].spr;
  enemies.forEach(e => { if (ET[e.type].ground) drawSpr(sprOf(e), e.x, e.y, e.flash > 0 ? 'f' : 'c'); });
  items.forEach(drawItem);

  ctx.globalAlpha = .25;
  enemies.forEach(e => { if (!ET[e.type].ground) drawSpr({ s: sprOf(e).s, w: sprOf(e).w, h: sprOf(e).h }, e.x + 16, e.y + 26, 's'); });
  if (player.alive) drawSpr({ s: SPR.player.s, w: SPR.player.w, h: SPR.player.h }, player.x + 16, player.y + 26, 's');
  ctx.globalAlpha = 1;

  enemies.forEach(e => { if (!ET[e.type].ground) drawSpr(sprOf(e), e.x, e.y, e.flash > 0 ? 'f' : 'c'); });

  const p = player;
  if (p.alive && !(p.inv > 0 && ((frame >> 2) & 1))) {
    ctx.fillStyle = (frame & 2) ? '#ffd23d' : '#ff8a2a';
    ctx.fillRect(Math.round(p.x) - 3, Math.round(p.y) + 22, 6, 5 + (frame & 1) * 3);
    drawSpr(SPR.player, p.x, p.y);
    if (st === 'play') { ctx.fillStyle = '#e8453c'; ctx.fillRect(Math.round(p.x) - 2, Math.round(p.y) - 2, 5, 5); ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 3, 3); }
  }
  pb.forEach(b => {
    if (b.a === 0) { ctx.fillStyle = '#ffb92a'; ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 7, 4, 14); ctx.fillStyle = '#fffbd0'; ctx.fillRect(Math.round(b.x) - 1, Math.round(b.y) - 6, 2, 12); }
    else { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.a); ctx.fillStyle = '#ffb92a'; ctx.fillRect(-2, -6, 4, 12); ctx.fillStyle = '#fffbd0'; ctx.fillRect(-1, -5, 2, 10); ctx.restore(); }
  });
  eb.forEach(b => drawSpr(BULS[b.k], b.x, b.y));
  parts.forEach(q => { ctx.fillStyle = q.c; ctx.fillRect(Math.round(q.x), Math.round(q.y), 2, 2); });
  booms.forEach(b => {
    const grow = Math.min(1, b.t / 9), rad = b.r * (1 - Math.pow(1 - grow, 2)), al = b.t < 9 ? 1 : 1 - (b.t - 9) / 19;
    const circ = (r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(b.x, b.y, Math.max(0, r), 0, PI * 2); ctx.fill(); };
    circ(rad, `rgba(255,110,30,${al})`); circ(rad * .7, `rgba(255,214,80,${al})`); circ(rad * .38, `rgba(255,255,235,${al})`);
  });
  if (bombT > 0) {
    const k = 1 - bombT / 100;
    ctx.strokeStyle = `rgba(154,234,255,${1 - k})`; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(p.x, p.y, 20 + k * 620, 0, PI * 2); ctx.stroke();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(p.x, p.y, 10 + k * 420, 0, PI * 2); ctx.stroke();
  }
  if (flashA > 0) { ctx.fillStyle = `rgba(255,255,255,${flashA * .7})`; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  floats.forEach(f => txt(f.text, f.x, f.y, f.c, 'center', 10));
  hud();
}
function hud() {
  txt('SCORE', 10, 8, '#9aeaff'); txt(String(score).padStart(8, '0'), 10, 22, '#fff');
  txt('HI', W - 10, 8, '#9aeaff', 'right'); txt(String(Math.max(hi, score)).padStart(8, '0'), W - 10, 22, '#fff', 'right');
  if (st !== 'menu') {
    txt('STAGE ' + stage, W / 2, 8, '#ffd23d', 'center');
    for (let i = 0; i < Math.min(player.lives, 8); i++) ctx.drawImage(SPR.player.c, 8 + i * 24, H - 32, SPR.player.w * .45, SPR.player.h * .45);
    for (let i = 0; i < player.bombs; i++) {
      const x = W - 22 - i * 22, y = H - 24;
      ctx.fillStyle = '#0e1019'; ctx.fillRect(x - 9, y - 9, 18, 18); ctx.fillStyle = '#4a82f0'; ctx.fillRect(x - 8, y - 8, 16, 16);
      txt('B', x, y - 4, '#fff', 'center', 8);
    }
  }
  if (boss && boss.state !== 'enter') {
    const bw = 300, x = (W - bw) / 2, y = 44, r = Math.max(0, boss.hp / boss.mhp);
    ctx.fillStyle = '#0e1019'; ctx.fillRect(x - 2, y - 2, bw + 4, 12);
    ctx.fillStyle = r > .33 ? '#e8453c' : '#ffd23d'; ctx.fillRect(x, y, bw * r, 8);
  }
  if (banner && (!banner.blink || ((banner.t >> 3) & 1))) txt(banner.text, W / 2, 300, banner.col, 'center', 22);
}

/* ===================== 흐름 / UI ===================== */
let ovAt = 0;
function showOverlay(html) { ovAt = performance.now(); ov.innerHTML = html; ov.classList.remove('hide'); const b = ov.querySelector('.primary'); if (b) b.focus(); }
function hideOverlay() { ov.classList.add('hide'); ov.innerHTML = ''; }
function showMenu() {
  st = 'menu'; keys.clear();
  showOverlay(`<div class="card">
    <h1>AIR STRIKE<br>1945</h1>
    <p>자동 연사. 피하고, 파워업 먹고, 보스를 격추하라.</p>
    <p class="big">HI ${String(hi).padStart(8, '0')}</p>
    <div class="btns"><button class="primary" data-act="start">출격</button></div>
    <dl class="legend">
      <dt><kbd>←↑↓→</kbd></dt><dd>이동 (화면 드래그도 가능)</dd>
      <dt><kbd>Shift</kbd></dt><dd>느리게 이동. 빨간 점이 피격 판정</dd>
      <dt><kbd>Space</kbd></dt><dd>폭탄. 탄막을 지우고 적에게 피해</dd>
      <dt><kbd>P</kbd></dt><dd>일시정지</dd>
    </dl></div>`);
}
function startGame() {
  audio();
  Object.assign(player, { x: W / 2, y: H - 90, lvl: 1, bombs: 3, lives: 3, inv: 120, alive: true, respT: 0, shotT: 0 });
  enemies = []; pb = []; eb = []; items = []; parts = []; booms = []; floats = []; later = [];
  stage = 1; stageT = 0; nextWave = 100; boss = null; clearT = 0; bombT = 0; flashA = 0; shake = 0; goT = 0; lastCarrier = 0;
  score = 0; nextExtra = 50000; frame = 0;
  banner = { t: 150, text: 'STAGE 1', col: '#ffd23d' };
  hideOverlay(); st = 'play';
}
function gameOver() {
  st = 'over';
  const rec = score > hi;
  if (rec) { hi = score; try { localStorage.setItem('airstrike1945-hi', String(hi)); } catch (e) {} }
  showOverlay(`<div class="card"><h2>GAME OVER</h2>
    <p class="big">${String(score).padStart(8, '0')}</p>
    <p>${rec ? '최고 기록 갱신!' : 'STAGE ' + stage + ' 도달'}</p>
    <div class="btns"><button class="primary" data-act="start">다시 출격</button><button data-act="menu">메뉴</button></div></div>`);
}
function togglePause() {
  if (st === 'play') { st = 'paused'; keys.clear(); showOverlay(`<div class="card"><h2>일시정지</h2><div class="btns"><button class="primary" data-act="resume">계속하기</button><button data-act="menu">메뉴</button></div></div>`); }
  else if (st === 'paused') { hideOverlay(); st = 'play'; }
}
function toggleMute() { muted = !muted; $('#mute').textContent = muted ? '소리 켬' : '소리 끔'; }

ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (performance.now() - ovAt < 500) return;
  if (b.dataset.act === 'start') startGame();
  else if (b.dataset.act === 'resume') togglePause();
  else if (b.dataset.act === 'menu') showMenu();
});
const NAV = ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '];
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!ov.classList.contains('hide')) {
    if (e.key === 'Enter') { const b = ov.querySelector('.primary'); if (b) { e.preventDefault(); b.click(); } }
    else if ((k === 'p' || k === 'escape') && st === 'paused') togglePause();
    return;
  }
  if (NAV.includes(k)) e.preventDefault();
  keys.add(k);
  if (e.repeat) return;
  if (k === ' ' || k === 'x') useBomb();
  else if (k === 'p' || k === 'escape') togglePause();
  else if (k === 'm') toggleMute();
});
addEventListener('keyup', e => { if (e.key === ' ' && !ov.classList.contains('hide')) e.preventDefault(); keys.delete(e.key.toLowerCase()); });
addEventListener('blur', () => { keys.clear(); if (st === 'play') togglePause(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && st === 'play') togglePause(); });

let tp = null;
cv.addEventListener('pointerdown', e => { tp = { id: e.pointerId, x: e.clientX, y: e.clientY }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} audio(); });
cv.addEventListener('pointermove', e => {
  if (!tp || e.pointerId !== tp.id) return;
  const k = W / cv.getBoundingClientRect().width;
  tdx += (e.clientX - tp.x) * k * 1.3; tdy += (e.clientY - tp.y) * k * 1.3;
  tp.x = e.clientX; tp.y = e.clientY;
});
['pointerup', 'pointercancel'].forEach(ev => cv.addEventListener(ev, () => { tp = null; }));
$('#bombbtn').addEventListener('contextmenu', e => e.preventDefault());
$('#bombbtn').addEventListener('pointerdown', e => { e.preventDefault(); useBomb(); });
$('#pbtn').addEventListener('click', togglePause);
$('#mute').addEventListener('click', toggleMute);

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 16.667) { update(); acc -= 16.667; }
  render();
  requestAnimationFrame(loop);
}

makeBg();
showMenu();
requestAnimationFrame(loop);
})();
</script>
</body>
