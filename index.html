<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고전 게임 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --void:#0e0b24; --panel:#181440; --edge:#3a2f7a; --ink:#f1ead2; --dim:#9b94c8; --fire:#ffcf3d; --hot:#ff7a45;
  --px:'Press Start 2P','Courier New',monospace;
  --ko:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--void);color:var(--ink);font-family:var(--ko);min-height:100%}
body{padding:max(22px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom));display:flex;justify-content:center}
main{width:100%;max-width:880px;display:flex;flex-direction:column;gap:26px}
header{display:flex;flex-direction:column;gap:12px}
h1{font-family:var(--px);font-size:clamp(20px,5.6vw,38px);line-height:1.4;margin:0;color:var(--fire);text-shadow:3px 3px 0 #b3361f,6px 6px 0 #0e0b24;letter-spacing:1px}
header p{margin:0;color:var(--dim);font-size:14px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.game{display:flex;flex-direction:column;background:var(--panel);border:2px solid var(--edge);color:inherit;text-decoration:none;transition:transform .12s steps(2),border-color .12s}
.game:hover,.game:focus-visible{border-color:var(--fire);transform:translateY(-3px)}
.game:focus-visible{outline:3px solid var(--fire);outline-offset:3px}
.game canvas{width:100%;aspect-ratio:8/5;image-rendering:pixelated;display:block;border-bottom:2px solid var(--edge);background:#000}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.body h2{margin:0;font-size:18px}
.body p{margin:0;font-size:13px;color:var(--dim);line-height:1.5}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.meta span{font-size:12px;color:var(--ink);background:#0e0b24;border:1px solid var(--edge);padding:3px 8px}
.hi{font-family:var(--px);font-size:9px;color:var(--fire);margin-top:3px}
.soon{border-style:dashed;align-items:center;justify-content:center;min-height:240px;color:var(--dim);text-align:center;gap:10px;padding:20px;background:transparent}
.soon b{font-family:var(--px);font-size:34px;color:var(--edge)}
.soon span{font-size:13px}
footer{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<main>
  <header>
    <h1>고전 게임 모음</h1>
    <p>PC와 모바일 모두 지원. 게임을 고르면 바로 시작합니다.</p>
  </header>
  <div id="grid"></div>
  <footer>새 게임을 추가하려면 게임 파일을 같은 폴더에 올리고, 이 파일 아래쪽 <code>GAMES</code> 목록에 항목 하나만 추가하면 됩니다.</footer>
</main>

<script>
/* ===== 게임 목록: 새 게임은 여기에 한 항목만 추가 ===== */
const GAMES = [
  {
    title: '탱크 대전',
    desc: '각도와 파워를 맞춰 포탄을 날리는 턴제 포격전. 땅이 파이고 바람이 분다.',
    href: 'tank.html',
    thumb: 'tank',
    tags: ['CPU 대전 · 2인', '가로 화면 추천']
  },
  {
    title: 'AIR STRIKE 1945',
    desc: '자동 연사 종스크롤 슈팅. 파워업을 먹고 탄막을 피해 보스를 격추한다.',
    href: '1945.html',
    thumb: 'plane',
    hiKey: 'airstrike1945-hi',
    tags: ['1인', '세로 화면 추천']
  },
  {
    title: '테트리스',
    desc: '떨어지는 블록으로 줄을 완성해 지운다. 홀드와 고스트 블록 지원.',
    href: 'tetris.html',
    thumb: 'tetris',
    hiKey: 'tetris-hi',
    tags: ['1인', '터치 버튼', '세로 화면 추천']
  },
  {
    title: '2048',
    desc: '같은 숫자 타일을 밀어서 합쳐 2048을 만드는 퍼즐. 되돌리기 가능.',
    href: '2048.html',
    thumb: 'g2048',
    hiKey: '2048-best',
    tags: ['1인', '스와이프', '세로 화면 추천']
  }
  // { title:'새 게임', desc:'설명', href:'newgame.html', thumb:null, tags:['태그'] },
];

/* ===== 썸네일 (도트 그림) ===== */
const rint = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
function sprite(g, rows, pal, x, y, s) {
  rows.forEach((r, j) => {
    const full = r + r.slice(0, -1).split('').reverse().join('');
    full.split('').forEach((ch, i) => { if (ch !== '.') { g.fillStyle = pal[ch]; g.fillRect(x + i * s, y + j * s, s, s); } });
  });
}
const THUMBS = {
  tank(g) {
    const sky = ['#140f3a', '#2a1a62', '#4b2a86', '#7a3a96', '#b4507e', '#e8706a'];
    sky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * 17, 160, 18); });
    g.fillStyle = '#f6efc2'; g.fillRect(124, 12, 12, 12); g.fillRect(122, 14, 16, 8);
    const hs = [];
    for (let x = 0; x < 160; x++) hs[x] = 62 + Math.sin(x * .05) * 14 + Math.sin(x * .13 + 1) * 6;
    hs.forEach((h, x) => {
      g.fillStyle = '#5bd35b'; g.fillRect(x, h | 0, 1, 2);
      g.fillStyle = '#8a5a2b'; g.fillRect(x, (h | 0) + 2, 1, 100);
    });
    g.fillStyle = '#6a401e'; for (let i = 0; i < 40; i++) g.fillRect(rint(0, 159), rint(76, 99), 3, 1);
    const tank = (x, c, d) => { const y = hs[x] | 0; g.fillStyle = '#1b1830'; g.fillRect(x - 8, y - 3, 16, 3); g.fillStyle = d; g.fillRect(x - 7, y - 6, 14, 4); g.fillStyle = c; g.fillRect(x - 5, y - 9, 10, 3); return y; };
    const y1 = tank(26, '#ff7a45', '#b3481f'), y2 = tank(132, '#45d8ff', '#1c8aa8');
    g.fillStyle = '#f1ead2'; for (let i = 0; i < 8; i++) g.fillRect(26 + i * 2, y1 - 9 - i * 2, 2, 2);
    g.fillStyle = '#ffe9a8'; for (let t = 0; t < 12; t++) { const x = 40 + t * 8; g.fillRect(x, 20 + Math.pow((t - 6) / 6, 2) * 22, 2, 2); }
    g.fillStyle = '#ff7a1e'; g.beginPath(); g.arc(136, y2 - 4, 11, 0, 7); g.fill();
    g.fillStyle = '#ffd650'; g.beginPath(); g.arc(136, y2 - 4, 7, 0, 7); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.arc(136, y2 - 4, 3, 0, 7); g.fill();
  },
  plane(g) {
    g.fillStyle = '#1b5b9c'; g.fillRect(0, 0, 160, 100);
    for (let i = 0; i < 60; i++) { g.fillStyle = Math.random() < .5 ? '#2a73b4' : '#3b86c6'; g.fillRect(rint(0, 150), rint(0, 99), rint(3, 8), 1); }
    const disc = (cx, cy, r, c) => { g.fillStyle = c; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r - y * y)); g.fillRect(cx - w, cy + y, w * 2 + 1, 1); } };
    disc(30, 70, 20, '#2f93c4'); disc(30, 70, 17, '#e6d59a'); disc(30, 70, 14, '#4a9a48'); disc(34, 73, 8, '#3a7f3c');
    disc(135, 22, 12, '#2f93c4'); disc(135, 22, 9, '#e6d59a'); disc(135, 22, 6, '#4a9a48');
    const enemy = ['.....y', '.....r', '...rrc', '.rrrrc', 'rrrrrR', 'r..rrr', '.....r', '.....g'].reverse();
    const E = { y: '#ffd23d', r: '#e8453c', R: '#8f1f2a', c: '#9aeaff', g: '#a7b0c2' };
    sprite(g, enemy, E, 46, 10, 2); sprite(g, enemy, E, 78, 20, 2); sprite(g, enemy, E, 110, 8, 2);
    const me = ['.......w', '.......w', '......gw', '......gc', '......gc', '.....bgb', '....bbbb', '...bbbbb', 'gbbbbbbb', 'bbbbbbbb', 'Bbbbbbbb', 'B..bbBbb', '......Bb', '.......y'];
    sprite(g, me, { w: '#f4f4f4', g: '#a7b0c2', c: '#9aeaff', b: '#4a82f0', B: '#223f9e', y: '#ffd23d' }, 66, 60, 2);
    g.fillStyle = '#ffb92a'; [[73, 54], [73, 44], [73, 34], [87, 54], [87, 44], [87, 34]].forEach(p => g.fillRect(p[0], p[1], 2, 6));
    g.fillStyle = '#ff4d86'; [[52, 44], [86, 54], [118, 38], [64, 74], [100, 70]].forEach(p => { g.fillRect(p[0], p[1], 4, 4); g.fillStyle = '#fff'; g.fillRect(p[0] + 1, p[1] + 1, 2, 2); g.fillStyle = '#ff4d86'; });
  },
  tetris(g) {
    g.fillStyle = '#0e0b24'; g.fillRect(0, 0, 160, 100);
    const S = 8, X0 = 40;
    g.fillStyle = '#080618'; g.fillRect(X0, 4, 80, 92);
    g.strokeStyle = '#3a2f7a'; g.lineWidth = 2; g.strokeRect(X0 - 1, 3, 82, 94);
    const C = { I:'#4de8ff', O:'#ffd23d', T:'#b25cff', S:'#5bd35b', Z:'#ff4a5a', J:'#4a82f0', L:'#ff9a2a' };
    const blk = (x, y, col) => { const px = X0 + x * S, py = 4 + y * S; g.fillStyle = col; g.fillRect(px, py, S, S); g.fillStyle = 'rgba(255,255,255,.38)'; g.fillRect(px, py, S, 1); g.fillRect(px, py, 1, S); g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(px, py + S - 1, S, 1); g.fillRect(px + S - 1, py, 1, S); };
    const rows = [
      '..........', '..........', '..........', '..........',
      '.......T..', '..O...TTT.', '.OO.JJ.S..', 'LOOZJJSS..', 'LLZZJISSLL', 'ZZSSOIOJLZ', 'JJJSOOIOZZ'];
    const m = { I:'I', O:'O', T:'T', S:'S', Z:'Z', J:'J', L:'L' };
    rows.forEach((r, y) => r.split('').forEach((ch, x) => { if (ch !== '.') blk(x, y, C[m[ch]]); }));
    [[4,1],[3,2],[4,2],[5,2]].forEach(p => blk(p[0], p[1], C.T));
  },
  g2048(g) {
    g.fillStyle = '#0e0b24'; g.fillRect(0, 0, 160, 100);
    const S = 21, GAP = 3, X0 = 80 - (4 * S + 5 * GAP) / 2, Y0 = 50 - (4 * S + 5 * GAP) / 2;
    g.fillStyle = '#0b0920'; g.fillRect(X0, Y0, 4 * S + 5 * GAP, 4 * S + 5 * GAP);
    const V = { 2:['#2f3f8f','#fff'], 4:['#3f55b8','#fff'], 8:['#ff9a2a','#fff'], 16:['#ff7a45','#fff'], 32:['#ff4a5a','#fff'], 64:['#e8236b','#fff'], 128:['#ffd23d','#2a1300'], 256:['#ffe066','#2a1300'], 512:['#9aeaff','#06222c'], 1024:['#5bd35b','#062a0c'], 2048:['#ffffff','#2a1300'] };
    const board = [[2,4,8,16],[4,0,32,64],[0,128,256,512],[2,4,1024,2048]];
    board.forEach((row, r) => row.forEach((v, c) => {
      const x = X0 + GAP + c * (S + GAP), y = Y0 + GAP + r * (S + GAP);
      g.fillStyle = v ? V[v][0] : '#171150'; g.fillRect(x, y, S, S);
      if (v) {
        g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(x, y, S, 2); g.fillRect(x, y, 2, S);
        g.fillStyle = 'rgba(0,0,0,.3)'; g.fillRect(x, y + S - 2, S, 2); g.fillRect(x + S - 2, y, 2, S);
        g.fillStyle = V[v][1]; g.font = (String(v).length > 3 ? 6 : String(v).length > 2 ? 7 : 9) + 'px "Press Start 2P", monospace';
        g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(v), x + S / 2, y + S / 2 + 1);
      }
    }));
  }
};
function fallbackThumb(g, title) {
  g.fillStyle = '#1a1450'; g.fillRect(0, 0, 160, 100);
  g.fillStyle = '#3a2f7a'; g.font = '40px "Press Start 2P", monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(title.trim().charAt(0).toUpperCase(), 80, 52);
}

/* ===== 렌더 ===== */
const grid = document.getElementById('grid');
GAMES.forEach(gm => {
  const a = document.createElement('a');
  a.className = 'game'; a.href = gm.href; a.setAttribute('aria-label', gm.title + ' 시작');
  const c = document.createElement('canvas'); c.width = 160; c.height = 100;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
  (THUMBS[gm.thumb] || (x => fallbackThumb(x, gm.title)))(g);
  a.appendChild(c);
  const b = document.createElement('div'); b.className = 'body';
  const h = document.createElement('h2'); h.textContent = gm.title;
  const p = document.createElement('p'); p.textContent = gm.desc;
  const m = document.createElement('div'); m.className = 'meta';
  (gm.tags || []).forEach(t => { const s = document.createElement('span'); s.textContent = t; m.appendChild(s); });
  b.append(h, p, m);
  if (gm.hiKey) {
    let v = 0; try { v = +localStorage.getItem(gm.hiKey) || 0; } catch (e) {}
    if (v > 0) { const d = document.createElement('div'); d.className = 'hi'; d.textContent = 'HI ' + String(v).padStart(8, '0'); b.appendChild(d); }
  }
  a.appendChild(b);
  grid.appendChild(a);
});
const soon = document.createElement('div');
soon.className = 'game soon'; soon.innerHTML = '<b>?</b><span>다음 게임 준비 중</span>';
grid.appendChild(soon);

/* 방향키로 카드 이동 */
addEventListener('keydown', e => {
  const items = [...document.querySelectorAll('a.game')];
  const i = items.indexOf(document.activeElement);
  const next = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 }[e.key];
  if (!next || !items.length) return;
  e.preventDefault();
  items[(i + next + items.length) % items.length].focus();
});
</script>
</body>
</html>
